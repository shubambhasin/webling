<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Webling popup</title>
  <link rel="stylesheet" href="../extension/popup/popup.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <div id="share" class="share" hidden>
    <div class="sheet">
      <img id="card" alt="Your webling's share card">
      <div class="row"><button id="download">Download</button><button id="copy">Copy image</button><button id="post" class="primary">Post on X</button></div>
      <button id="close" class="link">Close</button>
    </div>
  </div>
  <script src="scene.js"></script>
</body>
</html>
