<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Webling promo tile</title>
  <!-- Chrome Web Store promo tiles, drawn with the real pet art. ?size=small (440×280) or marquee (1400×560).
       scripts/store-assets.mjs captures them. -->
  <style>
    html, body { margin: 0; overflow: hidden; background: #0d0a17; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="tile"></canvas>
  <canvas id="mark" hidden></canvas>
  <script src="../extension/shared/config.js"></script>
  <script src="../extension/shared/sprite.js"></script>
  <script src="../site/wordmark.js"></script>
  <script>
    const SIZES = {
      // u: one layout unit in pixels; everything below is written in units so both sizes share a layout
      small: { w: 440, h: 280, u: 1, mark: 5, headline: null },
      marquee: { w: 1400, h: 560, u: 2, mark: 11, headline: ['The internet is a mess.', 'Your webling eats it.'] },
    };
    const S = SIZES[new URLSearchParams(location.search).get('size')] || SIZES.small;
    const c = document.getElementById('tile'), g = c.getContext('2d');
    c.width = S.w;
    c.height = S.h;
    g.imageSmoothingEnabled = false;
    const u = S.u, MONO = 'ui-monospace, SFMono-Regular, Menlo, monospace', SANS = 'system-ui, -apple-system, sans-serif';
    const INK = '#120d1f', PAPER = '#f4efff', ACID = '#ffe14d', PINK = '#ff5fa2', VIOLET = '#8b5cff';

    // night sky: glows and a faint pixel grid
    for (const [x, y, r, color] of [[S.w * 0.9, -S.h * 0.1, S.h * 1.1, 'rgba(139,92,255,.42)'], [-S.w * 0.05, S.h * 0.8, S.h * 0.9, 'rgba(255,95,162,.22)']]) {
      const glow = g.createRadialGradient(x, y, 0, x, y, r);
      glow.addColorStop(0, color);
      glow.addColorStop(1, 'rgba(13,10,23,0)');
      g.fillStyle = glow;
      g.fillRect(0, 0, S.w, S.h);
    }
    g.fillStyle = 'rgba(255,255,255,.07)';
    for (let x = 0; x < S.w; x += 14 * u) for (let y = 0; y < S.h; y += 14 * u) g.fillRect(x, y, u, u);

    // A Win98-style pop-up, eaten from the left up to `cut` (0..1), with a scalloped bite edge.
    function popup(x, y, w, h, cut) {
      const o = document.createElement('canvas'), q = o.getContext('2d');
      o.width = w;
      o.height = h;
      q.fillStyle = '#c3c3c3';
      q.fillRect(0, 0, w, h);
      q.fillStyle = '#fff';
      q.fillRect(0, 0, w, 2 * u);
      q.fillRect(0, 0, 2 * u, h);
      q.fillStyle = '#404040';
      q.fillRect(0, h - 2 * u, w, 2 * u);
      q.fillRect(w - 2 * u, 0, 2 * u, h);
      const bar = q.createLinearGradient(0, 0, w, 0);
      bar.addColorStop(0, '#000080');
      bar.addColorStop(1, '#1084d0');
      q.fillStyle = bar;
      q.fillRect(4 * u, 4 * u, w - 8 * u, 18 * u);
      q.fillStyle = '#fff';
      q.font = `700 ${11 * u}px ${SANS}`;
      q.fillText('Newsletter.exe', 9 * u, 17 * u);
      q.fillStyle = '#c3c3c3';
      q.fillRect(w - 22 * u, 7 * u, 14 * u, 12 * u);
      q.fillStyle = INK;
      q.fillText('×', w - 19 * u, 17 * u);
      q.font = `900 ${17 * u}px ${SANS}`;
      q.fillText('WAIT! Don’t go!', 14 * u, 50 * u);
      q.font = `500 ${11 * u}px ${SANS}`;
      q.fillText('Subscribe and get 15% off.', 14 * u, 68 * u);
      q.fillStyle = '#fff';
      q.fillRect(14 * u, 78 * u, w * 0.5, 20 * u);
      q.fillStyle = '#888';
      q.fillText('you@email.com', 19 * u, 92 * u);
      q.fillStyle = PINK;
      q.fillRect(w * 0.5 + 22 * u, 78 * u, 80 * u, 20 * u);
      q.fillStyle = INK;
      q.font = `800 ${11 * u}px ${SANS}`;
      q.fillText('Subscribe', w * 0.5 + 33 * u, 92 * u);
      // the bite
      q.globalCompositeOperation = 'destination-out';
      const edge = w * cut, r = 9 * u;
      q.fillRect(0, 0, edge, h);
      for (let yy = 0; yy < h + r; yy += r * 1.6) {
        q.beginPath();
        q.arc(edge, yy, r, 0, Math.PI * 2);
        q.fill();
      }
      g.drawImage(o, x, y);
      // crumbs
      const rnd = mulberry(7);
      g.fillStyle = '#c3c3c3';
      for (let i = 0; i < 9; i++) g.fillRect(x + edge - (8 + rnd() * 50) * u, y + (rnd() * h * 0.9), 4 * u, 4 * u);
      return { edge: x + edge };
    }
    function mulberry(a) {
      return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    }
    // A pet standing with its feet at (x, ground).
    function pet(stage, clip, frame, seed, scale, x, ground, flip = false) {
      const { img, pad } = WL.art.bakeHalo(stage, clip, frame, seed, scale, flip);
      const left = Math.round(x - img.width / 2), top = Math.round(ground - img.height + pad);
      g.drawImage(img, left, top);
      return { left: left + pad, top: top + pad, right: left + img.width - pad };
    }
    function bubble(text, x, bottom, size) {
      g.font = `800 ${size}px ${MONO}`;
      const w = g.measureText(text).width + size * 1.4, h = size * 2;
      const left = Math.round(x - w / 2), top = Math.round(bottom - h - size * 0.6);
      const b = Math.max(2, Math.round(size / 6));
      g.fillStyle = INK;
      g.fillRect(left - b, top - b, w + 2 * b, h + 2 * b);
      g.fillRect(x - size * 0.4, top + h, size * 0.8, size * 0.6);
      g.fillStyle = '#fffdf5';
      g.fillRect(left, top, w, h);
      g.fillStyle = INK;
      g.fillText(text, left + size * 0.7, top + size * 1.38);
    }

    // the wordmark
    const mark = document.getElementById('mark');
    mark.dataset.text = 'WEBLING';
    mark.dataset.cell = S.mark;
    drawWordmark(mark);

    if (S === SIZES.small) {
      g.drawImage(mark, 26, 28);
      g.fillStyle = ACID;
      g.font = `800 17px ${MONO}`;
      g.fillText('eats pop-ups.', 28, 102);
      g.fillStyle = PAPER;
      g.fillText('has opinions.', 28, 124);
      const ground = 246;
      g.fillStyle = VIOLET;
      g.fillRect(20, ground + 4, 400, 4);
      const { edge } = popup(226, 104, 210, 120, 0.3);
      const me = pet('adult', 'eat', 0, 'mochi7', 5, edge - 4, ground);
      bubble('who invited you', me.left + 10, me.top, 11);
      pet('baby', 'happy', 1, 'juniper', 4, 62, ground);
      pet('legend', 'idle', 0, 'bean', 4, 130, ground);
    } else {
      g.drawImage(mark, 92, 92);
      g.fillStyle = PAPER;
      g.font = `900 52px ${SANS}`;
      g.fillText(S.headline[0], 96, 270);
      g.fillStyle = ACID;
      g.fillText(S.headline[1], 96, 334);
      g.fillStyle = '#b6acd2';
      g.font = `600 24px ${MONO}`;
      g.fillText('a tiny pixel pet with opinions, for Chrome', 98, 392);
      const ground = 470;
      g.fillStyle = VIOLET;
      g.fillRect(90, ground + 8, 1220, 8);
      const { edge } = popup(840, 150, 440, 250, 0.28);
      const me = pet('adult', 'eat', 0, 'mochi7', 10, edge - 8, ground);
      bubble('a pop-up? not on my watch', me.left + 30, me.top, 22);
      pet('baby', 'happy', 1, 'juniper', 8, 760, ground);
    }
    document.documentElement.dataset.ready = '1';
  </script>
</body>
</html>
