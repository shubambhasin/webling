<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Webling store screenshot</title>
  <!-- One Chrome Web Store screenshot: laid out at 640×400 and captured at 2x (1280×800).
       ?n=1..5 picks the shot. scripts/store-assets.mjs puts a picture in #page: a mock page captured with the real
       extension running on it (the extension skips iframes, so it can't run in here), or a Wrapped card. -->
  <style>
    :root { --night: #0d0a17; --line: #2e2547; --text: #f4efff; --muted: #b6acd2; --violet: #8b5cff; --pink: #ff5fa2;
      --acid: #ffe14d; --cyan: #4de2ff; --ink: #120d1f; --sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, monospace; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 640px; height: 400px; overflow: hidden; }
    body { position: relative; color: var(--text); font: 13px/1.45 var(--sans);
      background: radial-gradient(420px 260px at 92% -10%, rgba(139, 92, 255, .38), transparent 70%),
        radial-gradient(360px 260px at -8% 70%, rgba(255, 95, 162, .2), transparent 70%), var(--night); }
    body::before { content: ''; position: absolute; inset: 0; z-index: -1;
      background-image: radial-gradient(rgba(255, 255, 255, .07) 1px, transparent 1px); background-size: 14px 14px; }
    .wordmark { position: absolute; right: 26px; top: 26px; image-rendering: pixelated; }
    .cap { position: absolute; left: 28px; top: 20px; width: 470px; }
    h1 { margin: 0 0 4px; font: 900 28px/1.1 var(--sans); letter-spacing: -.5px; }
    h1 em { font-style: normal; color: var(--acid); }
    .cap p { margin: 0; color: var(--muted); font-size: 12.5px; }

    .browser { position: absolute; left: 28px; top: 112px; width: 584px; height: 292px; background: #fff; overflow: hidden;
      border: 2px solid #000; border-radius: 10px 10px 0 0; box-shadow: 6px 6px 0 var(--violet); }
    .bar { display: flex; align-items: center; gap: 10px; height: 28px; padding: 0 10px; background: #e9e6ef; border-bottom: 1px solid #c9c4d4; }
    .dots { display: flex; gap: 5px; }
    .dots i { width: 9px; height: 9px; border-radius: 50%; background: #ff5f57; }
    .dots i:nth-child(2) { background: #febc2e; }
    .dots i:nth-child(3) { background: #28c840; }
    .url { flex: 1; height: 18px; border-radius: 9px; background: #fff; color: #444; font: 10.5px/18px var(--sans); padding: 0 10px; }
    .url::before { content: '🔒 '; font-size: 8px; }
    .ext { width: 18px; height: 18px; border-radius: 4px; background: #d8d1f5; display: grid; place-items: center; }
    .ext img { width: 14px; height: 14px; image-rendering: pixelated; }
    .browser #page { display: block; width: 580px; height: 258px; }

    /* shot 5: a Wrapped card, at its real size in device pixels */
    .card-shot .cap { width: 584px; }
    .card-shot .wordmark { display: none; }
    .card-shot #page { position: absolute; left: 20px; top: 78px; width: 600px; height: 315px; border: 2px solid #000; box-shadow: 5px 5px 0 var(--cyan); }
  </style>
</head>
<body>
  <canvas class="wordmark" data-text="WEBLING" data-cell="2" aria-hidden="true"></canvas>
  <div class="cap"><h1 id="title"></h1><p id="sub"></p></div>
  <script src="../site/wordmark.js"></script>
  <script>
    const SHOTS = {
      1: { title: 'It eats <em>cookie banners.</em>', url: 'dailybyte.example/why-cookies',
        sub: 'A tiny pixel pet that lives on the pages you visit. Banners get chomped, crumbs and all. Nothing gets clicked, and one tap spits it back out.' },
      2: { title: 'Pop-ups don’t stand <em>a chance.</em>', url: 'fernhouse.example/monstera',
        sub: 'Newsletter traps, flash sales and paywall nags get eaten too, with a roast on the side. Wanted that one? Spit it out.' },
      3: { title: 'It has <em>takes.</em>', url: 'scrollr.example/home',
        sub: 'It notices LinkedIn, midnight shopping and 3am doomscrolling, and says something about it in one of five vibes.' },
      4: { title: 'Focus buddy. <em>It’s watching.</em>', url: 'scrollr.example/home',
        sub: 'Start a 25 or 50 minute session. Your webling sits, stays quiet, and calls you out if you sneak off to the feed.' },
      5: { layout: 'card', title: 'Your week, <em>wrapped.</em>',
        sub: 'Every week a verdict on your week online, from 3am menace to offline icon. Share it as a link.' },
    };
    const shot = SHOTS[new URLSearchParams(location.search).get('n')] || SHOTS[1];
    document.getElementById('title').innerHTML = shot.title;
    document.getElementById('sub').textContent = shot.sub;

    if (!shot.layout) {
      document.body.insertAdjacentHTML('beforeend', `
        <div class="browser">
          <div class="bar"><div class="dots"><i></i><i></i><i></i></div><div class="url">${shot.url}</div>
            <div class="ext"><img src="../extension/icons/32.png" alt=""></div></div>
          <img id="page" alt="A web page with a webling on it">
        </div>`);
    } else {
      document.body.classList.add('card-shot');
      document.body.insertAdjacentHTML('beforeend', '<img id="page" alt="A Webling Wrapped card">');
    }
  </script>
</body>
</html>
